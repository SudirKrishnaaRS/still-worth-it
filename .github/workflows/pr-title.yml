name: PR Title

# Deliberately its own file: this needs pull_request_target, not the plain
# pull_request trigger the other workflows use. pull_request_target runs
# with the workflow file from main (not the PR branch) and only reads PR
# metadata via the API - it never checks out or executes the PR's own code
# - so a PR can't tamper with this check by editing the workflow itself.
# `synchronize` is included (even though a new commit rarely changes the
# title) because a required status check needs a run recorded against
# every commit SHA, not just the one from when the PR was opened.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # "feature: ..." / "bug: ..." / "chore: ..." / "docs: ..." / "ci: ..."
          types: |
            feature
            bug
            chore
            docs
            ci
          # Require an actual description after the colon, not just whitespace.
          subjectPattern: ^(?!\s*$).+$
          subjectPatternError: |
            The description in "{title}" can't be empty after the "type: " prefix -
            e.g. "feature: add dark mode toggle" or "bug: fix theme flicker on reload".
          # Dependabot's own titles ("Bump x from 4 to 6") don't follow our
          # convention and never will - it always applies this label, so
          # skip validation for its PRs instead of permanently blocking them.
          ignoreLabels: |
            dependencies
